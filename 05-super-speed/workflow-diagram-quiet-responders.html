<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bringing quiet responders back: workflow</title>
<style>
  body { margin: 0; padding: 16px; font-family: Arial, Helvetica, sans-serif; background: #fff; color: #1f2937; }
  h1 { font-size: 18px; margin: 0 0 2px; color: #1F3864; }
  p.sub { margin: 0 0 8px; font-size: 12px; color: #595959; }
  svg { max-width: 100%; height: auto; }
  text { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #1f2937; }
  .t { font-weight: bold; }
  .s { font-size: 10.5px; fill: #4b5563; }
  .old { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
  .new { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 1.6; stroke-dasharray: 6 3; }
  .dec { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.2; }
  .ok  { fill: #ecfdf5; stroke: #047857; stroke-width: 1.2; }
  .bad { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.2; }
  .ln { stroke: #4b5563; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  .lnn { stroke: #7c3aed; stroke-width: 1.4; fill: none; stroke-dasharray: 6 3; marker-end: url(#b); }
  .lbl { font-size: 10.5px; font-weight: bold; fill: #374151; }
</style>
</head>
<body>
<h1>Bringing quiet responders back: workflow</h1>
<p class="sub">Companion to the one-page brief. Purple dashed = new. Grey = how Dispatch works today. Draft, not yet checked with Wen Li or Marcus.</p>
<svg viewBox="0 0 900 800" width="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow for bringing quiet responders back">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <!-- column headings -->
  <text x="400" y="14" text-anchor="middle" class="t" style="fill:#1F3864">Routing a callout</text>
  <text x="740" y="14" text-anchor="middle" class="t" style="fill:#7c3aed">Handler console (new)</text>

  <!-- 1 callout -->
  <rect class="old" x="270" y="24" width="260" height="42" rx="8"/>
  <text x="400" y="50" text-anchor="middle" class="t">Callout comes in</text>
  <path class="ln" d="M400,66 V100"/>

  <!-- 2 rank -->
  <rect class="old" x="270" y="100" width="260" height="56" rx="8"/>
  <text x="400" y="122" text-anchor="middle" class="t">Rank available responders</text>
  <text x="400" y="140" text-anchor="middle" class="s">proximity, capability, availability, history</text>
  <path class="ln" d="M400,156 V190"/>

  <!-- 3 quiet check NEW -->
  <rect class="new" x="270" y="190" width="260" height="56" rx="8"/>
  <text x="400" y="212" text-anchor="middle" class="t">Quiet check</text>
  <text x="400" y="230" text-anchor="middle" class="s">old misses fade; quiet responder gets a turn</text>
  <path class="lnn" d="M530,218 H610"/>
  <path class="ln" d="M400,246 V280"/>

  <!-- 4 ping -->
  <rect class="old" x="270" y="280" width="260" height="56" rx="8"/>
  <text x="400" y="302" text-anchor="middle" class="t">Ping the top responder</text>
  <text x="400" y="320" text-anchor="middle" class="s">90 second wait</text>
  <path class="ln" d="M400,336 V366"/>

  <!-- 5 nudge NEW -->
  <rect class="new" x="270" y="366" width="260" height="56" rx="8"/>
  <text x="400" y="388" text-anchor="middle" class="t">One nudge, halfway</text>
  <text x="400" y="406" text-anchor="middle" class="s">same responder, same 90s window</text>
  <path class="ln" d="M400,422 V445"/>

  <!-- decision -->
  <polygon class="dec" points="400,445 510,490 400,535 290,490"/>
  <text x="400" y="487" text-anchor="middle" class="t">Answered?</text>
  <text x="400" y="502" text-anchor="middle" class="s">by 90s</text>

  <!-- taken -->
  <path class="ln" d="M510,490 H610"/>
  <text x="560" y="482" text-anchor="middle" class="lbl">taken</text>
  <rect class="ok" x="610" y="462" width="260" height="56" rx="8"/>
  <text x="740" y="486" text-anchor="middle" class="t">Callout filled</text>
  <text x="740" y="504" text-anchor="middle" class="s">score goes up; back in normal order</text>

  <!-- turned down -->
  <path class="ln" d="M290,490 H200"/>
  <text x="245" y="482" text-anchor="middle" class="lbl">said no</text>
  <rect class="bad" x="20" y="462" width="180" height="56" rx="8"/>
  <text x="110" y="486" text-anchor="middle" class="t">Turned down</text>
  <text x="110" y="504" text-anchor="middle" class="s">score goes down, fades</text>
  <path class="ln" d="M110,518 V580"/>

  <!-- missed -->
  <path class="ln" d="M400,535 V580"/>
  <text x="412" y="563" class="lbl">no answer</text>
  <rect class="bad" x="270" y="580" width="260" height="56" rx="8"/>
  <text x="400" y="604" text-anchor="middle" class="t">Recorded as missed</text>
  <text x="400" y="622" text-anchor="middle" class="s">only after the nudge went unanswered</text>

  <!-- next responder -->
  <rect class="old" x="20" y="580" width="180" height="56" rx="8"/>
  <text x="110" y="604" text-anchor="middle" class="t">Next responder</text>
  <text x="110" y="622" text-anchor="middle" class="s">loops back to ping</text>
  <path class="ln" d="M270,608 H200"/>
  <path class="ln" d="M20,608 H8 V308 H270"/>

  <!-- unfilled -->
  <path class="ln" d="M400,636 V680"/>
  <text x="412" y="664" class="lbl">list empty</text>
  <rect class="bad" x="270" y="680" width="260" height="46" rx="8"/>
  <text x="400" y="707" text-anchor="middle" class="t">Callout goes unfilled</text>

  <!-- handler lane -->
  <rect class="new" x="610" y="190" width="260" height="56" rx="8"/>
  <text x="740" y="212" text-anchor="middle" class="t">Not offered in N days</text>
  <text x="740" y="230" text-anchor="middle" class="s">system notices a quiet responder</text>
  <path class="lnn" d="M740,190 V160"/>
  <rect class="new" x="610" y="100" width="260" height="56" rx="8"/>
  <text x="740" y="122" text-anchor="middle" class="t">Console says so in plain words</text>
  <text x="740" y="140" text-anchor="middle" class="s">"Quiet for N days"</text>
  <path class="lnn" d="M740,100 V70"/>
  <rect class="new" x="610" y="24" width="260" height="46" rx="8"/>
  <text x="740" y="44" text-anchor="middle" class="t">Handler taps Confirm</text>
  <text x="740" y="60" text-anchor="middle" class="s">availability and phone. No ticket.</text>

  <!-- legend -->
  <rect class="old" x="270" y="762" width="22" height="14" rx="3"/><text x="298" y="773" class="s">today</text>
  <rect class="new" x="350" y="762" width="22" height="14" rx="3"/><text x="378" y="773" class="s">new</text>
  <rect class="ok" x="430" y="762" width="22" height="14" rx="3"/><text x="458" y="773" class="s">filled</text>
  <rect class="bad" x="520" y="762" width="22" height="14" rx="3"/><text x="548" y="773" class="s">missed, declined, unfilled</text>
</svg>
</body>
</html>
